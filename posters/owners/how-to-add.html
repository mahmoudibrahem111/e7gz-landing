<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>إزاي تضيف ملعبك في ٥ خطوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../poster.css" />
</head>
<body>
  <img class="logo" src="../../assets/e7gz-logo.png" alt="E7GZ" />
  <div class="split">
    <div class="copy">
      <div class="eyebrow">E7GZ لأصحاب الملاعب</div>
      <h1>إزاي تضيف ملعبك في ٥ خطوات</h1>
      <p class="sub">كل خطوة والشاشة بتاعتها قدامك — من أول ما تدخل لحد ما تستقبل أول حجز.</p>
    </div>
    <div class="shots grid">
      <div class="step">
        <div class="num">١</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/owner-login.jpg" alt="" /></div>
        </div>
        <div class="cap">ادخل بحسابك</div>
      </div>
      <div class="step">
        <div class="num">٢</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/owner-add.jpg" alt="" /></div>
        </div>
        <div class="cap">ضيف ملعبك</div>
      </div>
      <div class="step">
        <div class="num">٣</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/owner-stadiums.jpg" alt="" /></div>
        </div>
        <div class="cap">شوفه منشور</div>
      </div>
      <div class="step">
        <div class="num">٤</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/owner-hours.jpg" alt="" /></div>
        </div>
        <div class="cap">اضبط المواعيد</div>
      </div>
      <div class="step">
        <div class="num">٥</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/owner-dashboard-live.jpg" alt="" /></div>
        </div>
        <div class="cap">استقبل حجوزاتك</div>
      </div>
    </div>
  </div>
  <div class="footer">E7GZ<b>.</b>APP</div>
</body>
</html>
