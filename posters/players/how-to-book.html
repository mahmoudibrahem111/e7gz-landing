<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>إزاي تحجز في ٥ خطوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../poster.css" />
</head>
<body>
  <img class="logo" src="../../assets/e7gz-logo.png" alt="E7GZ" />
  <div class="split">
    <div class="copy">
      <div class="eyebrow">E7GZ للّاعبين</div>
      <h1>إزاي تحجز<br>في ٥ خطوات</h1>
      <p class="sub">كل خطوة من الحجز والشاشة بتاعتها قدامك — من أول ما تفتح لحد ما تدفع وتتابع.</p>
    </div>
    <div class="shots grid">
      <div class="step">
        <div class="num">١</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/app-home.jpg" alt="" /></div>
        </div>
        <div class="cap">افتح ودوّر</div>
      </div>
      <div class="step">
        <div class="num">٢</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/app-venue.jpg" alt="" /></div>
        </div>
        <div class="cap">اختار ملعبك</div>
      </div>
      <div class="step">
        <div class="num">٣</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/app-venue-slot.jpg" alt="" /></div>
        </div>
        <div class="cap">حدّد موعدك</div>
      </div>
      <div class="step">
        <div class="num">٤</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen crop"><img src="../../assets/app-payment.jpg" alt="" /></div>
        </div>
        <div class="cap">ادفع أونلاين</div>
      </div>
      <div class="step">
        <div class="num">٥</div>
        <div class="phone">
          <div class="island"></div>
          <div class="phone-screen"><img src="../../assets/app-booking-details.jpg" alt="" /></div>
        </div>
        <div class="cap">تابع حجزك</div>
      </div>
    </div>
  </div>
  <div class="footer">E7GZ<b>.</b>APP</div>
</body>
</html>
